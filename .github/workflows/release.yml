name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build .exe
        run: python scripts/build_exe.py

      - name: Extract Changelog Entry
        shell: python
        run: |
          import re, os
          from pathlib import Path
          tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, changelog, re.DOTALL)
          notes = match.group(1).strip() if match else ""
          Path("RELEASE_BODY.md").write_text(notes, encoding="utf-8")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Spicetifix.zip
          body_path: RELEASE_BODY.md
          generate_release_notes: true
