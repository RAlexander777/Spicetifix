[project]
name = "spicetifix"
version = "1.7.0"
description = "Spicetifix - Automated Spotify & Spicetify installer (pywebview native window + Python sidecar)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "RAlexander777" },
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pywebview>=6.0",
]

[project.scripts]
spicetifix = "spicetifix.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
